# Development services only. Production deployment is a separate compose project
# per client wedding — see docs/CLIENT_DEPLOYMENT.md.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wedding -d wedding']
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in local S3, for working on or testing media storage:
  #   docker compose --profile s3 up -d s3
  # MinIO no longer publishes community images, so this is Adobe's S3 test server.
  s3:
    image: adobe/s3mock:4.10.0
    profiles: ['s3']
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: wedding-media
    ports:
      - '9090:9090'

volumes:
  pgdata:
