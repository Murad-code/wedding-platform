name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://wedding:wedding@localhost:5432/wedding
  PAYLOAD_SECRET: ci-only-secret-not-used-in-any-real-deployment-000
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding
          POSTGRES_DB: wedding
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wedding -d wedding"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    # The production artifact is built here because it is the thing that actually ships,
    # and because it has already caught a bug that only existed in a production build
    # (see docs/IMPLEMENTATION_PLAN.md, Phase 8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: wedding-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check it starts and answers as a non-root user
        run: |
          docker run -d --name wp-ci -p 3000:3000 \
            -e DATABASE_URL=postgres://wedding:wedding@172.17.0.1:5432/wedding \
            -e PAYLOAD_SECRET=ci-only-secret-not-used-in-any-real-deployment-000 \
            wedding-platform:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          test "$(docker exec wp-ci id -u)" = "1001"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding
          POSTGRES_DB: wedding
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wedding -d wedding"
          --health-interval 5s --health-timeout 5s --health-retries 10

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
